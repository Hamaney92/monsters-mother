name: Deploy Astro to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run check
      - run: npm run test:analytics
      - run: npm run build
        env:
          SITE_URL: https://mothersmonster.com
          BASE_PATH: /
          PUBLIC_GA_MEASUREMENT_ID: G-EX3NWTTVFR
      - run: npm run verify
      - run: node scripts/verify-locales.mjs
      - run: node scripts/verify-performance.mjs
      - run: node scripts/verify-book-seo.mjs
      - run: node scripts/verify-journal-guide.mjs
      - run: node scripts/verify-favicon.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
