name: Mobile quality regression check
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mobile-quality
  cancel-in-progress: true
jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/lighthouse-ci/package-lock.json
      - run: npm ci
      - run: npm ci --prefix tools/lighthouse-ci
      - run: npm run build
        env:
          SITE_URL: https://mothersmonster.com
          BASE_PATH: /
          PUBLIC_GA_MEASUREMENT_ID: G-EX3NWTTVFR
      - name: Collect three mobile runs per page
        run: node scripts/collect-mobile-quality.mjs
      - name: Summarize measured results
        if: always()
        run: node scripts/summarize-mobile-quality.mjs
      - name: Save reports in this repository only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-lighthouse-reports
          path: .lighthouseci/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
